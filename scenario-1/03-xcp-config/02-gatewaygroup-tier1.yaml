# GatewayGroup scoping the Tier1 gateway. It selects the cluster-0/tier1
# namespace and runs in BRIDGED config mode (XCP-native APIs).
#
# Apply to: XCP Central -> cluster-0, namespace xcp-system
apiVersion: gateway.xcp.tetrate.io/v2
kind: GatewayGroup
metadata:
  name: tier1-gg
  namespace: xcp-system
  labels:
    xcp.tetrate.io/workspace: passthrough-ws
spec:
  configMode: BRIDGED
  namespaceSelector:
    names:
      - cluster-0/tier1
