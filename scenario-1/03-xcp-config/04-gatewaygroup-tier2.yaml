# GatewayGroup scoping the Tier2 ingress gateway. Selects the cluster-1/echo
# namespace.
#
# Apply to: XCP Central -> cluster-0, namespace xcp-system
apiVersion: gateway.xcp.tetrate.io/v2
kind: GatewayGroup
metadata:
  name: tier2-gg
  namespace: xcp-system
  labels:
    xcp.tetrate.io/workspace: passthrough-ws
spec:
  configMode: BRIDGED
  namespaceSelector:
    names:
      - cluster-1/echo
