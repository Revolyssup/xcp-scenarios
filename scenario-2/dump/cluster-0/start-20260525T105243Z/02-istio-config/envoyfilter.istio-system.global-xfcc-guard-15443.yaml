spec:
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
        portNumber: 15443
    patch:
      operation: INSERT_FIRST
      value:
        name: istio-system.global--xfcc-extractor
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
          default_source_code:
            inline_string: |
              function envoy_on_request(request_handle)
                -- 1. Get XFCC Header
                local xfcc_val = request_handle:headers():get("x-forwarded-client-cert")
                if xfcc_val == nil or xfcc_val == "" then
                  -- XFCC header is not found, skip extraction.
                  return
                end

                -- 2. Get the first element before comma
                local xfcc_origin_element = xfcc_val:match("([^,]+)")
                if xfcc_origin_element == nil or xfcc_origin_element == "" then
                  return
                end

                -- 3. Loop over elements split by ";"
                -- We need to manually iterate to mimic split and validation
                local start_idx = 1
                local len = #xfcc_origin_element
                while start_idx <= len do
                  local end_idx = string.find(xfcc_origin_element, ";", start_idx)
                  local element
                  if end_idx == nil then
                    element = string.sub(xfcc_origin_element, start_idx)
                    start_idx = len + 1
                  else
                    element = string.sub(xfcc_origin_element, start_idx, end_idx - 1)
                    start_idx = end_idx + 1
                  end

                  -- 4. Check if element starts with "URI="
                  if string.sub(element, 1, 4) == "URI=" then
                      local value = string.sub(element, 5)
                      if value ~= nil and value ~= "" then
                        request_handle:headers():replace("x-peer-client-identity", value)
                      end
                      return
                  end
                end
                request_handle:logCritical("failed to parse xfcc header elements")
              end
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
        portNumber: 15443
    patch:
      operation: INSERT_FIRST
      value:
        name: istio-system.global--xfcc-saver
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
          on_request_headers:
          - factory_key: envoy.string
            format_string:
              text_format_source:
                inline_string: '%REQ(x-forwarded-client-cert)%'
            object_key: tetrate-original-xfcc-copy
            omit_empty_values: true
            read_only: true
            skip_if_empty: true
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.router
        portNumber: 15443
    patch:
      operation: INSERT_BEFORE
      value:
        name: istio-system.global--xfcc-setter
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
          mutations:
            request_mutations:
            - append:
                append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header:
                  key: x-forwarded-client-cert
                  value: '%FILTER_STATE(tetrate-original-xfcc-copy:PLAIN)%'
  workloadSelector:
    labels:
      istio: ingressgateway
