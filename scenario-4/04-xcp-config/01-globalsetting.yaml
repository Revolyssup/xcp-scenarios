# GlobalSetting: cluster-scoped network reachability.
#
# **This OVERWRITES the existing `global` GlobalSetting in xcp-system.** The
# original (created when the demo was first bootstrapped) only knew about
# nw-cluster-0 <-> nw-cluster-1. This version expands it to include cluster-2
# AND enforces the **transit constraint** that makes this scenario meaningful:
#
#   * nw-cluster-0  can reach only  nw-cluster-1
#   * nw-cluster-1  can reach       nw-cluster-0  AND  nw-cluster-2  (the transit)
#   * nw-cluster-2  can reach only  nw-cluster-1
#
# So cluster-0 CANNOT reach cluster-2 directly. When XCP resolves a host
# served by both cluster-1 (transit Tier1 internalServer) and cluster-2
# (Tier2 IngressGateway), it picks cluster-1 from cluster-0's perspective
# because cluster-2 is not network-reachable. That is what forces the
# request to hop through the transit gateway.
#
# Scenarios 1-3 still work — they only depend on cluster-0 <-> cluster-1,
# which is unchanged here.
#
# Apply to: XCP Central -> cluster-0, namespace xcp-system
apiVersion: xcp.tetrate.io/v2
kind: GlobalSetting
metadata:
  name: global
  namespace: xcp-system
spec:
  networkSettings:
    networkReachability:
      nw-cluster-0: nw-cluster-1
      nw-cluster-1: nw-cluster-0,nw-cluster-2
      nw-cluster-2: nw-cluster-1
