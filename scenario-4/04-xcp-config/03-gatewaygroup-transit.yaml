# GatewayGroup for the TRANSIT Gateway on cluster-1.
#
# Apply to: XCP Central -> cluster-0, namespace xcp-system
apiVersion: gateway.xcp.tetrate.io/v2
kind: GatewayGroup
metadata:
  name: transit-mid-gg
  namespace: xcp-system
  labels:
    xcp.tetrate.io/workspace: transit-ws
spec:
  configMode: BRIDGED
  namespaceSelector:
    names:
      - cluster-1/transit
